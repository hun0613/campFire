# Render 블루프린트: GitHub 저장소를 연결하면 이 설정대로 자동 배포돼요.
services:
  - type: web
    name: campfire-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SAVE_SECRET   # 장작 저장 백업 서명용 (Render가 자동으로 만들어 줘요)
        generateValue: true
