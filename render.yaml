# Render 블루프린트: GitHub 저장소를 연결하면 이 설정대로 자동 배포돼요.
services:
  - type: web
    name: campfire-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SAVE_SECRET   # 장작 저장 백업 서명용 (Render가 자동으로 만들어 줘요)
        generateValue: true
      - key: YT_API_KEY    # 곡 검색용 YouTube Data API 키 (Render 대시보드에서 직접 입력)
        sync: false
      - key: NOTION_TOKEN  # 방명록 저장용 노션 연결 키 (Render 대시보드에서 직접 입력)
        sync: false
      - key: NOTION_GUESTBOOK_DB  # 방명록 노션 데이터베이스 ID
        value: 5c18c9a4ca29407fa760afe913914120
      - key: ADMIN_PASSWORD  # 관리자 페이지(/admin) 비밀번호 (Render 대시보드에서 직접 입력, 8자 이상)
        sync: false
      - key: VITE_GTM_ID  # 이용 분석용 Google Tag Manager 컨테이너 ID (빌드할 때 페이지에 들어가요, 공개 값)
        value: GTM-NKJLDBKJ
